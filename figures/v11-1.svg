<svg viewBox="0 0 260 200" width="280" role="img" aria-label="A corner of Omega at p, an empty square Q_p outside Omega with p at its corner, the charge point y inside Q_p on its diagonal, and dashed level curves of the barrier around y.">
  <rect x="20" y="20" width="220" height="160" fill="var(--def-bg)"/>
  <rect x="120" y="90" width="120" height="90" fill="var(--paper)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="150" cy="120" r="14" fill="none" stroke="var(--res-ink)" stroke-width="2"/>
  <circle cx="150" cy="120" r="34" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="150" cy="120" r="62" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="150" cy="120" r="95" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="120" y1="90" x2="150" y2="120" stroke="currentColor" stroke-width="1"/>
  <circle cx="120" cy="90" r="3" fill="currentColor"/>
  <circle cx="150" cy="120" r="2.5" fill="var(--res-ink)"/>
  <text x="112" y="84" text-anchor="end" font-size="13" font-style="italic" fill="currentColor">p</text>
  <text x="156" y="134" font-size="12" font-style="italic" fill="var(--res-ink)">y</text>
  <text x="126" y="112" font-size="11" font-style="italic" fill="currentColor">d</text>
  <text x="200" y="170" font-size="13" font-style="italic" fill="currentColor">Q<tspan font-size="9" dy="3">p</tspan></text>
  <text x="34" y="42" font-size="14" font-style="italic" fill="currentColor">Ω</text>
</svg>