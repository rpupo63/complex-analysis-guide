<svg viewBox="0 0 300 140" width="320" role="img" aria-label="Graph of U against distance to the boundary: rising linearly from 0 to 1 over a layer of width epsilon, then constant 1.">
  <line x1="30" y1="110" x2="285" y2="110" stroke="currentColor" stroke-width="1"/>
  <line x1="30" y1="120" x2="30" y2="15" stroke="currentColor" stroke-width="1"/>
  <line x1="30" y1="40" x2="70" y2="40" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <polyline points="30,110 70,40 280,40" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="70" y="126" text-anchor="middle" font-size="13" font-style="italic" fill="currentColor">ε</text>
  <text x="22" y="44" text-anchor="end" font-size="13" fill="currentColor">1</text>
  <text x="22" y="114" text-anchor="end" font-size="13" fill="currentColor">0</text>
  <text x="280" y="128" text-anchor="end" font-size="12" fill="currentColor">distance to ∂Ω</text>
  <text x="180" y="32" font-size="13" font-style="italic" fill="var(--accent)">U ≡ 1</text>
</svg>